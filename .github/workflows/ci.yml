name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exact versions, all three components. A bare major resolves to the
        # newest release of that line, so a job named 18 is not a test of a
        # floor of 18.
        node: ['20.18.1', '22.23.5', '24.11.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: the runtime is the one this job claims
        run: |
          node -e "if (process.versions.node !== '${{ matrix.node }}') { console.error('got ' + process.versions.node); process.exit(1); }"
      - name: the suite
        run: npm test
      - name: the real binary over every artefact, including through a symlink
        run: node tools/exit-codes.mjs
      - name: the checkers over every artefact, in both output modes
        run: node tools/audit-verdicts.mjs
      - name: the entry point is still wiring
        run: node tools/entry-thin.mjs
      - name: the counted test total
        run: node tools/count-tests.mjs

  verify:
    name: repository assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
      - name: every repository claim
        run: node tools/verify.mjs

  documents:
    name: generated documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
      - name: the documents match their generator
        run: node tools/gen-docs.mjs --check

  engines:
    name: engines accepted at the floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
      - name: the declared floor installs on the declared floor
        run: npm install --engine-strict --no-audit --no-fund

  engines-refusal:
    name: engines refused above the floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
      - name: a floor above the runtime has to be refused
        # Installing at the floor passes whether or not engine-strict does
        # anything, so the refusal is tested by raising the floor beyond the
        # runtime and requiring the install to fail.
        run: |
          node -e "const fs = require('fs'); const m = JSON.parse(fs.readFileSync('package.json', 'utf8')); m.engines.node = '>=99.0.0'; fs.writeFileSync('package.json', JSON.stringify(m, null, 2) + '\n');"
          if npm install --engine-strict --no-audit --no-fund; then
            echo "npm accepted a floor above the runtime"
            exit 1
          fi
          git checkout package.json
          echo "refused, as it should be"
