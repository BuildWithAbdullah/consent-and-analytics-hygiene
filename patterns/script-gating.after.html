<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Example store</title>
<link rel="preconnect" href="https://cdn.example.com">
</head>
<body>
<main id="page">
  <h1>Example store</h1>
</main>
<section id="cookie-notice" aria-label="Cookie choices">
  <button type="button" id="cmp-accept">Accept all</button>
  <button type="button" id="cmp-reject">Reject all</button>
</section>
<script type="text/plain" class="cmp-consent-analytics" src="https://www.googletagmanager.com/gtag/js?id=G-EXAMPLE1"></script>
<script>
function activateParkedScripts() {
  var parked = document.querySelectorAll('script[type="text/plain"]');
  for (var index = 0; index < parked.length; index += 1) {
    parked[index].type = 'text/javascript';
  }
}
document.getElementById('cmp-accept').addEventListener('click', activateParkedScripts);
</script>
</body>
</html>
